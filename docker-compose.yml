services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: support-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: support_agent
      POSTGRES_PASSWORD: support_agent
      POSTGRES_DB: support_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: support-agent-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: support_agent
      RABBITMQ_DEFAULT_PASS: support_agent
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  postgres_data:
  rabbitmq_data:
